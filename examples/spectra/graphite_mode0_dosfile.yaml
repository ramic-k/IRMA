# IRMA spectra — mode 0 from a DOS file (no phonopy needed)
#
# VISION-resolved INS spectrum of graphite from a 2-column carbon phonon DOS.
# The DOS ships with the repo (derived from the vendored graphite phonopy
# model); swap in your own file — from MD/VACF, a measurement, or any phonon
# code — to model your material.
#
# Run from this directory (examples/spectra/):
#   python -m irma spectra run graphite_mode0_dosfile.yaml -o graphite_vision_mode0.csv
#
# Runtime: a few seconds.
material:
  temperature_K: 300.0
  # unit cell [a, b, c (Angstrom), alpha, beta, gamma (deg)] — enables the
  # coherent-elastic Bragg peaks; delete it (and positions) for an
  # incoherent-only elastic line, or set physics.elastic_kind: incoherent.
  lattice: [2.4612, 2.4612, 6.7079, 90.0, 90.0, 120.0]
  scatterers:
    - symbol: C
      sigma_bound_b: 5.551          # bound scattering cross section [barn]
      awr: 11.898                   # mass ratio to the neutron
      b_coh_fm: 6.646               # coherent scattering length [fm]
      sigma_inc_b: 0.001            # incoherent cross section [barn]
      dos_file: data/graphite_C_dos.txt
      dos_unit: meV                 # meV | eV | cm-1 | THz
      multiplicity: 4               # atoms of this element per cell
      positions: [[0, 0, 0.25], [0, 0, 0.75],
                  [0.3333, 0.6667, 0.25], [0.6667, 0.3333, 0.75]]
physics:
  inelastic_mode: 0                 # DOS + isotropic Debye-Waller
  dos_source: file                  # this example reads the dos_file above
  elastic: true
  elastic_kind: both                # both | coherent | incoherent
grid: {e_min_meV: 0.0, e_max_meV: 250.0, de_meV: 1.0, dq_max_invA: 0.1}
instrument: {geometry: vision, e_fixed_meV: 3.5}
