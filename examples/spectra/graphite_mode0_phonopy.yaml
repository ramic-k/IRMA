# IRMA spectra — mode 0 with the partial DOS derived from a phonopy model
#
# Same DOS-based physics as graphite_mode0_dosfile.yaml, but the per-element
# partial DOS (and multiplicities) are computed from the phonopy.yaml + mesh
# instead of read from files. You still supply the scattering data per element.
#
# Run from this directory (examples/spectra/):
#   python -m irma spectra run graphite_mode0_phonopy.yaml -o graphite_vision_mode0p.csv
#
# Runtime: a few seconds (mostly the 24^3 phonon mesh).
material:
  phonopy_yaml: ../../tests/mode2_euphonic_n1_validation/graphite/phonopy.yaml
  mesh: [24, 24, 24]
  temperature_K: 300.0
  lattice: [2.4612, 2.4612, 6.7079, 90.0, 90.0, 120.0]
  scatterers:
    - symbol: C
      sigma_bound_b: 5.551
      awr: 11.898
      b_coh_fm: 6.646
      sigma_inc_b: 0.001
      multiplicity: 4
      positions: [[0, 0, 0.25], [0, 0, 0.75],
                  [0.3333, 0.6667, 0.25], [0.6667, 0.3333, 0.75]]
physics:
  inelastic_mode: 0
  dos_source: phonopy               # derive each element's partial DOS
  elastic: true
  elastic_kind: both
grid: {e_min_meV: 0.0, e_max_meV: 250.0, de_meV: 1.0, dq_max_invA: 0.1}
instrument: {geometry: vision, e_fixed_meV: 3.5}
