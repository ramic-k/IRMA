# Optional local pre-commit hooks. Enable with:  pre-commit install
# Runs the CI `ruff-lint` rules (see [tool.ruff] in pyproject.toml) before each
# commit; keep `rev` in the range requirements-dev.txt pins. `--fix` applies the
# safe fixes (unused-import / empty-f-string removal); the re-export modules are
# protected by the per-file-ignores in pyproject.toml.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
