[project]
name = "ncrystal-plugin-IRMA"
version = "0.6.0"
description = "NCrystal plugin that samples IRMA's mode-2 powder thermal-scattering law from per-temperature baked .irmapack files (@CUSTOM_IRMA NCMAT sections)"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    { name = "Kemal Ramic", email = "ramick@ornl.gov" },
]
requires-python = ">=3.11"
dependencies = [ "ncrystal-core>=4.3.0", "ncrystal-pypluginmgr>=0.0.5" ]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Repository = "https://github.com/ramic-k/IRMA"

# NOTE: The Python package here only carries the compiled plugin. The pack
# format, producers and CLI live in the IRMA core package (irma.ncrystal,
# `python -m irma.ncrystal`), so no console-script entry points are declared.

[build-system]
requires = ["scikit-build-core>=0.12", "ncrystal-core>=4.3.0" ]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
#build.verbose = true
#cmake.build-type = "Debug"
logging.level = "INFO"
minimum-version = "build-system.requires"
wheel.packages = ["python/ncrystal_plugin_IRMA"]
wheel.py-api = "py3"

[tool.pytest.ini_options]
pythonpath = ["python"]
