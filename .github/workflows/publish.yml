# PyPI publish via trusted publishing (OIDC): no long-lived tokens.
# Fires only when a GitHub Release is published (v* tags), i.e. never
# while the repository is private. The 'pypi' environment is created on
# first use; the pending trusted publisher on PyPI must name this file.
name: Publish

on:
  release:
    types: [published]

jobs:
  pypi:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
